appId: com.internal.gitevidencegenerator
productName: Git Evidence Generator
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true

# Internal/personal use only - no code signing, no auto-update infrastructure.
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
